name: Deploy config builder to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'webapp/**'
      - 'sysmonv9.xml'
      - 'SysmonForLinux/config.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Unit tests
        working-directory: webapp
        run: |
          npm ci
          npm test

      - name: Assemble site
        run: |
          mkdir -p _site/presets
          cp -R webapp/index.html webapp/css webapp/js _site/
          # Ship the repo's current configs as the app's presets.
          cp sysmonv9.xml _site/presets/windows.xml
          cp SysmonForLinux/config.xml _site/presets/linux.xml
          node webapp/scripts/check-xml.mjs _site/presets/*.xml
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
